apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-fh-swf-staging

bases:
  - ../../base

nameSuffix: -staging

replicas:
  - name: fh-swf-mcp-deployment
    count: 1
  - name: neo4j
    count: 1

patchesStrategicMerge:
  - deployment-patch.yaml

images:
  - name: fh-swf-mcp
    newName: ghcr.io/fhswf/mcp_fh-swf
    newTag: "main-${GIT_SHA}"  # wird durch CI/CD automatisch gesetzt

commonLabels:
  environment: staging
  branch: main

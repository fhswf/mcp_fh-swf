apiVersion: apps/v1
kind: Deployment
metadata:
  name: fh-swf-mcp-deployment
spec:
  replicas: 2
  template:
    spec:
      containers:
      - name: fh-swf-mcp
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        env:
          - name: VPIS_LOG_LEVEL
            value: "WARNING"
          - name: ENVIRONMENT
            value: "production"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - fh-swf-mcp
              topologyKey: kubernetes.io/hostname

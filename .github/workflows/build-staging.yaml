name: Build Docker Image for Staging

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/build-staging.yaml'

permissions:
  contents: read
  packages: write

jobs:
  build-staging:
    runs-on: ubuntu-latest
    name: Build and Push Docker Image (Staging)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Tag
        id: image-tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="main-${SHORT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "full-tag=ghcr.io/${{ github.repository }}:${TAG}" >> $GITHUB_OUTPUT
          echo "Building Docker image with tag: ${TAG}"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image-tag.outputs.full-tag }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      - name: Comment PR with Image Tag
        if: github.event_name == 'push'
        run: |
          echo "✅ Docker image built and pushed: ${{ steps.image-tag.outputs.full-tag }}"
